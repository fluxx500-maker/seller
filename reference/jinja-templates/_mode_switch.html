{# Ночной / дневной режим: одна кнопка, выбор запоминается (cookie ui_mode). Пока не выбран — как в настройках устройства. #}
<button type="button" class="icon-btn mode-btn" data-mode-toggle aria-label="Ночная или дневная тема" title="Ночная / дневная тема">
  <span class="mode-dark">{{ icon('moon') }}<span class="mode-text">Ночь</span></span>
  <span class="mode-light">{{ icon('sun') }}<span class="mode-text">День</span></span>
</button>
